plugins {
    id "java"
    id "application"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-7"
    id "com.peterabeles.gversion" version "1.10"
    id "com.diffplug.spotless" version "8.6.0"
    id 'org.graalvm.buildtools.native' version '1.1.14'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

graalvmNative {
    binaries {
        named("main") {
            buildArgs.addAll("--tool:svm-wasm", "-g")
        }
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

def ROBOT_MAIN_CLASS = "org.teamvan.robot.Main"

def debugMode = project.hasProperty("debugMode");
def deployRequested = gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })
def simRequested = gradle.startParameter.taskNames.any({ it.toLowerCase().contains("run") })

configurations {
    asyncProfilerConverter
    upstreamHal
}

// Define my targets (SystemCore) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.wpilib.getTeamNumber()
            // Use the default systemcore host name. This must be called after setting team
            // as happens on the line above
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                    // Set to true to use debug including JNI, which will drastically impact performance.
                    debugJni = false

                    // TO ENTER DEBUG MODE:
                    // Run: ./gradlew deploy -PdebugMode
                    // -- do not do this unless you want profiling mode, it can slow the robot down.
                    // Enter debug mode with ./gradlew deploy -PdebugMode
                    if (debugMode) {
                        jvmArgs.add("-DdebugMode=true")

                        project.logger.lifecycle('Debug mode enabled!')

                        def hostname = "roborio-" + team + "-frc.local"
                        def ipAddress = "10." + (team / 100) + ".2"

                        if(simRequested) {
                            hostname = "localhost"
                            ipAddress = "127.0.0.1"
                        }

                        project.logger.lifecycle("Connect JMX client to " + hostname + ":1099 or " + ipAddress + ":1099 for RoboRIO profiling with visualvm.")
                        jvmArgs.add("-Dcom.sun.management.jmxremote=true")
                        jvmArgs.add("-Dcom.sun.management.jmxremote.port=1099")
                        jvmArgs.add("-Dcom.sun.management.jmxremote.local.only=false")
                        jvmArgs.add("-Dcom.sun.management.jmxremote.ssl=false")
                        jvmArgs.add("-Dcom.sun.management.jmxremote.authenticate=false")
                        jvmArgs.add("-Djava.rmi.server.hostname=" + ipAddress)

                        project.logger.lifecycle("Connect debugger to " + hostname + ":5005 or " + ipAddress + ":5005 for RoboRIO debugging with IntelliJ/VSCode.")
                        jvmArgs.add("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005")
                    }
                }

                // Static files artifact
                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = true // Change to true to delete files on systemcore that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

run {
    systemProperty 'debugMode', debugMode
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

// Set to true to use debug for simulation including JNI
wpi.java.runSimWithDebugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Configuration for AdvantageKit
task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

def halSimOutDir = layout.buildDirectory.dir('hal-sim').get().asFile
def halSimJarFile = new File(halSimOutDir, 'hal-java-sim.jar')
def wpiSimJarFile = new File(halSimOutDir, 'wpiutil-java-sim.jar')
halSimOutDir.mkdirs()
def moduleCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
def findCachedJar = { group, name, version ->
    def dir = new File(moduleCache, "${group}/${name}/${version}")
    def matches = dir.exists() ? fileTree(dir).matching {
        include "**/${name}-${version}.jar"
    }.files : [] as Set
    if (matches.isEmpty()) {
        throw new GradleException("Missing ${group}:${name}:${version} in ${dir}")
    }
    matches.iterator().next()
}
def upstreamHalJar = findCachedJar('org.wpilib.hal', 'hal-java', '2027.0.0-alpha-7')
def upstreamWpiJar = findCachedJar('org.wpilib.wpiutil', 'wpiutil-java', '2027.0.0-alpha-7')
def upstreamNtJar = findCachedJar('org.wpilib.ntcore', 'ntcore-java', '2027.0.0-alpha-7')
def ntSimJarFile = new File(halSimOutDir, 'ntcore-java-sim.jar')
def halSimDigest = java.security.MessageDigest.getInstance('SHA-256')
[
    upstreamHalJar,
    upstreamWpiJar,
    upstreamNtJar
].each { halSimDigest.update(it.bytes) }
fileTree('src/halSim/java').matching { include '**/*.java' }.sort { it.path }.each { halSimDigest.update(it.bytes) }
fileTree('src/main/java/org/teamvan/hal').matching { include '**/*.java' }.sort { it.path }.each { halSimDigest.update(it.bytes) }
def halSimStamp = halSimDigest.digest().encodeHex().toString()
def halSimStampFile = new File(halSimOutDir, 'inputs.sha256')
if (!(halSimStampFile.exists() && halSimStampFile.text == halSimStamp && halSimJarFile.exists() && wpiSimJarFile.exists() && ntSimJarFile.exists())) {
    def halSimWork = new File(halSimOutDir, 'work')
    halSimWork.deleteDir()
    halSimWork.mkdirs()
    def strippedHal = new File(halSimWork, 'hal-stripped.jar')
    def strippedWpi = new File(halSimWork, 'wpi-stripped.jar')
    org.teamvan.hal.build.StripNative.rewrite(upstreamHalJar.toPath(), strippedHal.toPath())
    org.teamvan.hal.build.StripNative.rewrite(upstreamWpiJar.toPath(), strippedWpi.toPath())
    def strippedNt = new File(halSimWork, 'nt-stripped.jar')
    org.teamvan.hal.build.StripNative.rewrite(upstreamNtJar.toPath(), strippedNt.toPath())
    def retargetedHal = new File(halSimWork, 'hal-retargeted.jar')
    def retargetedWpi = new File(halSimWork, 'wpi-retargeted.jar')
    def retargetedNt = new File(halSimWork, 'nt-retargeted.jar')
    logger.lifecycle("HAL sim retargeted ${org.teamvan.hal.build.Retarget.rewrite(strippedHal.toPath(), retargetedHal.toPath())} methods")
    logger.lifecycle("WPIUtil sim retargeted ${org.teamvan.hal.build.Retarget.rewrite(strippedWpi.toPath(), retargetedWpi.toPath())} methods")
    logger.lifecycle("NT sim retargeted ${org.teamvan.hal.build.Retarget.rewrite(strippedNt.toPath(), retargetedNt.toPath())} methods")
    def halSimClasses = new File(halSimWork, 'classes')
    halSimClasses.mkdirs()
    def javac = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }.get().executablePath.toString()
    def simSources = (fileTree('src/halSim/java') + fileTree('src/main/java/org/teamvan/hal')).files
    def command = []
    def webimage = new File(halSimWork, 'webimage')
    copy {
        from(zipTree(new File(System.getProperty('java.home'), 'jmods/org.graalvm.webimage.api.jmod')))
        into webimage
    }
    command << javac << '--release' << '25' << '-d' << halSimClasses.absolutePath << '-cp' << ([
        retargetedHal,
        retargetedWpi,
        retargetedNt,
        new File(webimage, 'classes')
    ].collect { it.absolutePath }.join(File.pathSeparator))
    simSources.each { command << it.absolutePath }
    def process = new ProcessBuilder(command.collect { it.toString() }).inheritIO().start()
    if (process.waitFor() != 0) {
        throw new GradleException('HAL sim javac failed')
    }
    ant.jar(destfile: halSimJarFile) {
        zipfileset(src: retargetedHal)
        fileset(dir: halSimClasses) { include(name: 'org/teamvan/hal/**') }
    }
    ant.jar(destfile: wpiSimJarFile) {
        zipfileset(src: retargetedWpi) {
            exclude(name: 'org/wpilib/util/runtime/RuntimeLoader.class')
        }
        fileset(dir: halSimClasses) {
            include(name: 'org/teamvan/hal/**')
            include(name: 'org/wpilib/util/runtime/RuntimeLoader.class')
        }
    }
    ant.jar(destfile: ntSimJarFile) {
        zipfileset(src: retargetedNt)
        fileset(dir: halSimClasses) { include(name: 'org/teamvan/hal/**') }
    }
    halSimStampFile.text = halSimStamp
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    upstreamHal 'org.wpilib.hal:hal-java:2027.0.0-alpha-7'
    upstreamHal 'org.wpilib.wpiutil:wpiutil-java:2027.0.0-alpha-7'
    implementation files(halSimJarFile, wpiSimJarFile, ntSimJarFile)
    implementation wpi.java.vendor.java()

    configurations.matching {
        it.name in [
            'compileClasspath',
            'runtimeClasspath',
            'testCompileClasspath',
            'testRuntimeClasspath'
        ]
    }.configureEach {
        exclude group: 'org.wpilib.hal', module: 'hal-java'
        exclude group: 'org.wpilib.wpiutil', module: 'wpiutil-java'
        exclude group: 'org.wpilib.ntcore', module: 'ntcore-java'
        exclude group: 'org.wpilib.hal', module: 'hal-jni'
        exclude group: 'org.wpilib.wpiutil', module: 'wpiutil-jni'
        exclude group: 'org.wpilib.ntcore', module: 'ntcore-jni'
    }

    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def asyncProfVersion = "4.5"
    def asyncProf = "tools.profiler:async-profiler:$asyncProfVersion"
    if (debugMode) {
        implementation asyncProf
    } else {
        compileOnly asyncProf
    }
    asyncProfilerConverter "tools.profiler:jfr-converter:$asyncProfVersion"

    //def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    //annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}


test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
//
// The sim GUI is *disabled* by default to support running
// AdvantageKit log replay, which requires that all HAL
// sim extensions be disabled.
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

application.mainClass = ROBOT_MAIN_CLASS

deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

jar {
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
}

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

def vendorDependencyCoordinates = fileTree('vendordeps')
        .matching { include '**/*.json' }
        .collectMany { vendorFile ->
            def vendor = new groovy.json.JsonSlurper().parse(vendorFile)
            (vendor.javaDependencies ?: []).collect { dependency ->
                "${dependency.groupId}:${dependency.artifactId}:${dependency.version}"
            }
        }

def resolveJavadocDependencySources = {
    def wpilibDependencyCoordinates = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { it.moduleVersion.id.group.startsWith('org.wpilib') || it.moduleVersion.id.group.startsWith('tools.profiler') }
            .collect { artifact ->
                def module = artifact.moduleVersion.id
                "${module.group}:${module.name}:${module.version}"
            }
    def coordinates = (vendorDependencyCoordinates + wpilibDependencyCoordinates).unique()
    def requestedArtifacts = coordinates.collect {
        def dependency = dependencies.create("${it}:sources@jar")
        dependency.transitive = false
        dependency
    }
    configurations.detachedConfiguration(*requestedArtifacts)
            .resolvedConfiguration
            .lenientConfiguration
            .getArtifacts()
            .collect { it.file }
}

tasks.named('javadoc', Javadoc) {
    classpath = files(sourceSets.main.runtimeClasspath, configurations.annotationProcessor)
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    options.group('org.teamvan.*', 'org.teamvan.*')
    options.addBooleanOption('Xdoclint:none', true)
    options.bottom = "<a href='https://teamvan.org'>Team V.A.N.</a>"
    doFirst {
        def javadocDependencySources = resolveJavadocDependencySources()
        source = files(sourceSets.main.allJava, javadocDependencySources.collect {
            zipTree(it).matching {
                include '**/*.java'
                exclude '**/module-info.java'
            }
        })
    }
}


// Create version file
project.compileJava.dependsOn(createVersionFile)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "org.teamvan.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/New_York"
    indent       = "  "
}

// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (deployRequested) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

task generateFlamegraphs {
    group = "Profiling"
    description = "Scans profiler/*/ directories and converts .jfr files into flamegraph.html."

    doLast {
        def profilerRoot = file("profiler")
        if (!profilerRoot.exists() || !profilerRoot.isDirectory()) {
            println "No 'profiler' directory found at ${profilerRoot.absolutePath}. Skipping flamegraph generation."
            return
        }

        // Get the resolved JAR file(s) from the configuration (uses local cache, no new downloads)
        def cpFiles = configurations.asyncProfilerConverter.files
        if (cpFiles.empty) {
            throw new GradleException("Async-profiler dependency files could not be resolved.")
        }

        println "Resolved async-profiler converter JAR files: ${cpFiles}"

        // Create an isolated ClassLoader to run the async-profiler converter entry point
        URL[] urls = cpFiles.collect { it.toURI().toURL() } as URL[]
        URLClassLoader classLoader = new URLClassLoader(urls, this.getClass().getClassLoader())
        // Iterate through all subdirectories under profiler/ (i.e. profiler/*/)
        profilerRoot.eachDir { subDir ->
            def jfrFiles = []
            subDir.eachFileMatch(groovy.io.FileType.FILES, ~/.*\.jfr$/) { jfrFile ->
                jfrFiles << jfrFile.absolutePath
            }

            if (!jfrFiles.isEmpty()) {
                def htmlFile = new File(subDir, "flamegraph.html")
                println "Converting ${jfrFiles.size()} JFR file(s) in '${subDir.name}' -> ${htmlFile.name}"

                try {
                    // Modern async-profiler (4.x+) uses one.convert.Main
                    Class<?> converterMain = classLoader.loadClass("one.convert.Main")
                    def mainMethod = converterMain.getMethod("main", String[].class)

                    // Build argument array: all JFR files followed by the output HTML file path
                    List<String> argList = []
                    argList.addAll(jfrFiles)
                    argList.add(htmlFile.absolutePath)
                    String[] args = argList.toArray(new String[0])

                    mainMethod.invoke(null, [args] as Object[])
                } catch (Exception ex) {
                    ex.printStackTrace()
                    throw new GradleException("Failed to invoke async-profiler converter for directory '${subDir.name}'", ex)
                }
            }
        }
        println "Flamegraph generation completed successfully!"
    }
}

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**"
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include "**/*.json"
            exclude "**/build/**", "**/build-*/**", ".wpilib/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**"
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
